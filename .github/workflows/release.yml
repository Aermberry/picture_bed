name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build and publish (skip GitHub Release if tag already exists)'
        required: false
        default: ''
      skip_github_release:
        description: 'Skip GitHub Release step (installer-only rebuild)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # Windows NSIS 安装包（唯一分发形态；2026-11-10 起 npm/tgz 发布随 CLI/MCP 移除）。
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build desktop installer
        run: npm run desktop:dist
        env:
          # Avoid electron-builder code-sign prompts; unsigned is OK for v1.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Copy stable asset name
        shell: pwsh
        run: |
          Copy-Item release/picbed-setup-*.exe release/picbed-setup.exe
      - name: Upload desktop installer to GitHub Release
        if: ${{ github.event_name == 'push' || inputs.skip_github_release != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref_name="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.ref }}" ]; then
            ref_name="${{ inputs.ref }}"
          fi
          gh release upload "$ref_name" release/picbed-setup-*.exe release/picbed-setup.exe --clobber
