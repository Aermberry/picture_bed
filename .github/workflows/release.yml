name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack
      - name: Copy stable asset name
        run: cp picbed-*.tgz picbed.tgz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" picbed-*.tgz picbed.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      - name: Publish to npm (trusted publishing / OIDC)
        id: npm_publish
        continue-on-error: true
        run: |
          # No long-lived NPM_TOKEN. Requires npm Trusted Publisher
          # bound to Aermberry/picture_bed + workflow file release.yml.
          # Provenance is generated automatically by npm for OIDC publishes.
          npm publish --access public
      - name: npm publish status
        if: steps.npm_publish.outcome != 'success'
        run: |
          echo "::warning::npm publish failed (often E404 until Trusted Publisher is configured on npmjs.com for package 'picbed' + workflow release.yml). GitHub Release assets are already published."
          echo "Re-run this job after configuring Trusted Publisher, or publish manually once to claim the name."
