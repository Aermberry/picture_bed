name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack
      - name: Copy stable asset name
        run: cp picbed-*.tgz picbed.tgz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" picbed-*.tgz picbed.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      - name: Publish to npm (trusted publishing / OIDC)
        run: |
          # No long-lived NPM_TOKEN. Requires npm Trusted Publisher
          # bound to Aermberry/picture_bed + workflow file release.yml.
          # Provenance is generated automatically by npm for OIDC publishes.
          npm publish --access public
